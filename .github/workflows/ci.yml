name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Shared code (jvm compile + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Upstream's res is the reference the jvm string tests compare against.
          submodules: true
      - name: Tool self-tests
        run: |
          python3 tools/codemod.py --self-test
          python3 tools/import_resources.py --self-test
      - name: Resources match upstream
        run: |
          python3 tools/import_resources.py
          git diff --exit-code -- shared/src/commonMain/composeResources
          test -z "$(git status --porcelain -- shared/src/commonMain/composeResources)"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:jvmTest --stacktrace
      - name: Require jvm tests to have run
        run: |
          total=$(grep -ho 'tests="[0-9]*"' shared/build/test-results/jvmTest/*.xml | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          echo "jvm tests run: $total"
          test "$total" -gt 0
      - name: Live API smoke test result
        # LiveInnerTubeSmokeTest passes when YouTube turns the runner away, and says so here.
        if: always()
        run: |
          if grep -q 'LIVE SMOKE: BLOCKED' shared/build/test-results/jvmTest/*.xml; then
            grep -ho 'LIVE SMOKE: BLOCKED[^<]*' shared/build/test-results/jvmTest/*.xml | sed 's/^/::warning::/'
          else
            echo "Live API reached: no block reported"
          fi
      - name: Live playback chain result
        if: always()
        run: |
          grep -Eho 'LIVE (PLAYBACK|CIPHER): [^<]*' shared/build/test-results/jvmTest/*.xml || echo "no live playback lines"
          grep -ho 'ffmpeg on [^<]*' shared/build/test-results/jvmTest/*.xml || echo "ffmpeg check did not run"
          if grep -q 'LIVE PLAYBACK: BLOCKED' shared/build/test-results/jvmTest/*.xml; then
            grep -ho 'LIVE PLAYBACK: BLOCKED[^<]*' shared/build/test-results/jvmTest/*.xml | sed 's/^/::warning::/'
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-test-results
          path: shared/build/test-results/jvmTest/
          if-no-files-found: ignore

  ios:
    name: iOS (simulator tests, app build, launch screenshot)
    needs: jvm
    # Pull requests stop at the jvm job; the iOS job runs on pushes to main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # A cold run also builds FFmpeg and dav1d for two slices.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The ported InnerTube tests read upstream's JSON fixtures in place.
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Restore and save apart, so a failed run still keeps the Kotlin/Native toolchain it downloaded.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
      # The bundled engine's decoders (S04b), keyed on the build script, which pins the versions, checksums and flags.
      - name: Restore FFmpeg + dav1d xcframework
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-xcframework-${{ runner.os }}-${{ hashFiles('tools/build_ffmpeg_xcframework.sh') }}
      - name: Build FFmpeg + dav1d xcframework
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          command -v pkg-config || brew install pkgconf
          tools/build_ffmpeg_xcframework.sh
      - uses: actions/cache/save@v6
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: build/ffmpeg
          key: ffmpeg-xcframework-${{ runner.os }}-${{ hashFiles('tools/build_ffmpeg_xcframework.sh') }}
      - name: Pick newest iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")], reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$SIM_ID"
      - name: Boot the simulator
        # The tests run on the booted device: a standalone spawn has no trust daemon for TLS.
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
      - name: Shared tests on the iOS simulator
        # Everything but the live playback chain, which runs next in a process of its own.
        run: |
          status=0
          ./gradlew :shared:iosSimulatorArm64Test -PiosSimulatorDevice="$SIM_ID" -PexcludeTests=io.github.aedev.flow.player.LivePlaybackChainTest --stacktrace || status=$?
          mkdir -p ios-test-results/unit
          cp shared/build/test-results/iosSimulatorArm64Test/*.xml ios-test-results/unit/ || true
          exit $status
      - name: Live playback tests on the iOS simulator
        # LivePlaybackChainTest: the ladder, the loopback HLS proxy and the cipher in JavaScriptCore.
        if: ${{ !cancelled() }}
        run: |
          status=0
          rm -rf shared/build/test-results/iosSimulatorArm64Test
          ./gradlew :shared:iosSimulatorArm64Test -PiosSimulatorDevice="$SIM_ID" --tests io.github.aedev.flow.player.LivePlaybackChainTest --stacktrace || status=$?
          mkdir -p ios-test-results/live
          cp shared/build/test-results/iosSimulatorArm64Test/*.xml ios-test-results/live/ || true
          exit $status
      - name: Require iOS tests to have run
        if: ${{ !cancelled() }}
        run: |
          total=$(grep -ho 'tests="[0-9]*"' ios-test-results/*/*.xml | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          failed=$(grep -ho 'failures="[0-9]*"' ios-test-results/*/*.xml | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          echo "iOS simulator tests run: $total, failed: $failed"
          test "$total" -gt 0
      - name: Live API smoke test result
        if: always()
        run: |
          if grep -q 'LIVE SMOKE: BLOCKED' ios-test-results/*/*.xml; then
            grep -ho 'LIVE SMOKE: BLOCKED[^<]*' ios-test-results/*/*.xml | sed 's/^/::warning::/'
          else
            echo "Live API reached: no block reported"
          fi
      - name: Live playback chain result
        if: always()
        run: |
          grep -Eho 'LIVE (PLAYBACK|CIPHER): [^<]*' ios-test-results/*/*.xml || echo "no live playback lines"
          if grep -q 'LIVE PLAYBACK: BLOCKED' ios-test-results/*/*.xml; then
            grep -ho 'LIVE PLAYBACK: BLOCKED[^<]*' ios-test-results/*/*.xml | sed 's/^/::warning::/'
          fi
      - name: Generate Xcode project
        # This and the app steps run even when a test step failed, so one macOS run always yields the gate's evidence.
        if: ${{ !cancelled() }}
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml
      - name: Build app
        if: ${{ !cancelled() }}
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -destination "id=$SIM_ID" -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
      - name: Engine tests on the iOS simulator (S04b)
        # The bundled engine on local clips (iosApp/iosAppTests): VP9, AV1, Opus and AAC decoded, rendered, in sync and
        # seeking, hosted in the app. YouTube walls this runner off, so no live stream is involved.
        if: ${{ !cancelled() }}
        run: |
          status=0
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "id=$SIM_ID" -derivedDataPath build/xcode -resultBundlePath build/engine-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO || status=$?
          mkdir -p ios-test-results/engine
          xcrun xcresulttool get test-results summary --path build/engine-tests.xcresult --format json > ios-test-results/engine/summary.json || status=1
          DATA=$(xcrun simctl get_app_container "$SIM_ID" io.github.templimp.flow data || true)
          cp "$DATA/Documents/engine-tests.jsonl" ios-test-results/engine/ || true
          cat ios-test-results/engine/engine-tests.jsonl || true
          python3 - ios-test-results/engine/summary.json <<'EOF' || status=1
          import json, sys
          summary = json.load(open(sys.argv[1]))
          total = summary.get("totalTestCount") or 0
          print(f"engine tests run: {total}, passed: {summary.get('passedTests')}, failed: {summary.get('failedTests')}, skipped: {summary.get('skippedTests')} ({summary.get('result')})")
          for failure in summary.get("testFailures", []):
              print(f"::error::{failure.get('testName')}: {failure.get('failureText')}")
          sys.exit(0 if total > 0 else 1)
          EOF
          exit $status
      - name: Launch and screenshot
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" build/xcode/Build/Products/Debug-iphonesimulator/Flow.app
          PID=$(xcrun simctl launch "$SIM_ID" io.github.templimp.flow | awk '{print $2}')
          sleep 15
          if ! kill -0 "$PID"; then
            echo "::error::App exited within 15 s of launch"
            xcrun simctl spawn "$SIM_ID" log show --last 2m --predicate 'process == "Flow"' | tail -n 200
            exit 1
          fi
          mkdir -p screenshots
          xcrun simctl io "$SIM_ID" screenshot screenshots/launch.png
      - name: App icon is in the bundle
        if: ${{ !cancelled() }}
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon' build/xcode/Build/Products/Debug-iphonesimulator/Flow.app/Info.plist
      - name: Launch in Indonesian and screenshot
        if: ${{ !cancelled() }}
        # Upstream's values-in ships as values-id, the code iOS reports; this shows it is picked.
        run: |
          xcrun simctl terminate "$SIM_ID" io.github.templimp.flow || true
          xcrun simctl launch "$SIM_ID" io.github.templimp.flow -AppleLanguages "(id)" -AppleLocale id_ID
          sleep 10
          xcrun simctl io "$SIM_ID" screenshot screenshots/launch-id.png
      - name: Playback gate (S04, S04b)
        if: ${{ !cancelled() }}
        # A real video and a real YouTube Music song through the ported chain into AVPlayer and the bundled engine,
        # run by the Debug build's -flowPlaybackGate argument. A failure or a missing verdict fails the job; BLOCKED
        # (YouTube refused the runner) is a warning, as for the live smoke test.
        run: |
          xcrun simctl terminate "$SIM_ID" io.github.templimp.flow || true
          DATA=$(xcrun simctl get_app_container "$SIM_ID" io.github.templimp.flow data)
          RESULT="$DATA/Documents/playback-gate.json"
          rm -f "$RESULT"
          xcrun simctl launch "$SIM_ID" io.github.templimp.flow -flowPlaybackGate
          # The gate writes its final verdict within 22 minutes; it rewrites "RUNNING" with its layer as it goes.
          for i in $(seq 1 280); do
            if [ -f "$RESULT" ] && ! grep -q '"verdict":"RUNNING"' "$RESULT"; then break; fi
            if ! pgrep -f 'Flow.app/Flow' > /dev/null; then
              echo "::error::The app is no longer running"
              break
            fi
            sleep 5
          done
          mkdir -p screenshots
          xcrun simctl io "$SIM_ID" screenshot screenshots/playback-gate.png
          if [ ! -f "$RESULT" ]; then
            echo "::error::The playback gate wrote nothing"
            xcrun simctl spawn "$SIM_ID" log show --last 15m --predicate 'process == "Flow"' | tail -n 300
            exit 1
          fi
          cp "$RESULT" screenshots/
          python3 tools/check_playback_gate.py "$RESULT"
      - name: Crash reports
        # The test process's and the app's crash reports, with the crashing thread printed.
        if: always()
        run: |
          mkdir -p crash-reports
          find ~/Library/Logs/DiagnosticReports -name '*.ips' \( -name 'Flow*' -o -name 'test.kexe*' \) -exec cp {} crash-reports/ \; 2>/dev/null || true
          ls crash-reports
          python3 tools/print_crash_reports.py crash-reports/*.ips || true
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-evidence
          path: |
            screenshots/
            ios-test-results/
            crash-reports/
            build/engine-tests.xcresult/
          if-no-files-found: ignore
