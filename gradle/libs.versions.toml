[versions]
kotlin = "2.4.21"
# 1.13.0-beta01 ships material3 1.5.0-beta01, the first CMP line at or past upstream's Jetpack material3 1.5.0-alpha26.
compose-multiplatform = "1.13.0-beta01"
coroutines = "1.11.0"
kotlinx-io = "0.9.1"
# Ktor and kotlinx.serialization at the versions upstream pins.
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.7.1"
# The jvm target stands in for Android's android.icu (ICU4J repackaged); upstream's tests pin the same version.
icu4j = "77.1"
# The version kotlinx-coroutines and Ktor already resolve; its locks stand in for `synchronized` on Kotlin/Native.
atomicfu = "0.32.1"
# JavaScript engine for the jvm test target only, standing in for JavaScriptCore (never shipped).
graaljs = "24.2.2"
# SABR's brotli media on the jvm test target, the decoder upstream pins (iOS decodes brotli with libcompression).
brotli = "0.1.2"
# Room, DataStore and KSP at the versions upstream pins (its comment: DataStore 1.2.1 breaks its tests on Windows).
room = "2.8.4"
datastore = "1.1.7"
ksp = "2.3.11"
# The SQLite Room 2.8.4 is built against, bundled so jvm and iOS run the same SQLite.
sqlite = "2.6.2"
# Upstream's Paging 3; paging-common is the KMP part (PagingSource, Pager).
paging = "3.5.1"
# Already on the classpath through DataStore; declared for the random-access files the download tag writers need.
okio = "3.4.0"
# KtXmlReader, xmlutil's Kotlin port of kXML2 (the parser behind Android's XmlPullParser), on jvm and iOS alike.
xmlutil = "1.0.2"
# Upstream's mock library, for its tests that mock (jvm target only: mockk is JVM-only).
mockk = "1.14.11"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
graal-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graaljs" }
graal-js = { module = "org.graalvm.polyglot:js-community", version.ref = "graaljs" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
kotlin-test ={ module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
