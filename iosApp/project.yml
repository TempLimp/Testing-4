# XcodeGen spec: CI and any Mac run `xcodegen generate --spec iosApp/project.yml`; the .xcodeproj is not committed.
name: iosApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The Kotlin build phase runs Gradle, which writes outside the sandboxed script paths.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Flow
        PRODUCT_BUNDLE_IDENTIFIER: io.github.templimp.flow
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Upstream's adaptive launcher icon (tools/import_resources.py), as one 1024 px image.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
      configs:
        # Compiles the Debug-only playback gate hook in iOSApp.swift.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
